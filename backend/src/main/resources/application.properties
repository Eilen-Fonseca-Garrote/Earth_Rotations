spring.application.name=earthquakes-api
server.port=${PORT:1573}

# MongoDB (Spring Boot 4 usa spring.mongodb.*; se mantiene spring.data.mongodb.* por compatibilidad)
spring.mongodb.uri=${SPRING_DATA_MONGODB_URI:${MONGODB_URI:mongodb://localhost:27017/earth_rotations}}
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:${MONGODB_URI:mongodb://localhost:27017/earth_rotations}}
spring.data.mongodb.database=${MONGODB_DATABASE:earth_rotations}
management.health.mongo.enabled=false